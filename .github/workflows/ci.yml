name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Smoke production server
        run: |
          npm start -- -H 127.0.0.1 -p 4310 >/tmp/zerochill-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl --fail --silent --show-error --location http://127.0.0.1:4310/ >/tmp/zerochill-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/zerochill-index.html
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
